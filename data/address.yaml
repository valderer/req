normal_address:
  username: "lsf123"
  telephone: "18288889999"
  tmp_code:
    - "110000"
    - "110100"
    - "110102"
  adrdetail: "abcde"
  province: "北京市"
  city: "北京市"
  county: "西城区"
  is_def: 0
  company_id: "2"

telephone_cases:
  - case_id: "valid_11_digits"
    title: "合法的 11 位手机号"
    telephone: "18288889999"
    expected_valid: true

  - case_id: "empty_telephone"
    title: "手机号为空"
    telephone: ""
    expected_valid: false
    expected_http_status: 422
    expected_error_message: "请填写正确的手机号"
    expected_error_status_code: 422

  - case_id: "short_10_digits"
    title: "手机号少于 11 位"
    telephone: "1828888999"
    expected_valid: false
    expected_http_status: 422
    expected_error_message: "请填写正确的手机号"
    expected_error_status_code: 422

  - case_id: "long_12_digits"
    title: "手机号超过 11 位"
    telephone: "182888899999"
    expected_valid: false
    expected_http_status: 422
    expected_error_message: "请填写正确的手机号"
    expected_error_status_code: 422
