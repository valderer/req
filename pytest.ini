[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --clean-alluredir --alluredir=allure-results -m "not manual"
markers =
    manual: 手动执行、可能留下测试数据的用例
    smoke: 冒烟测试
    regression: 回归测试
    address: 地址模块
    cart: 购物车模块
    product: 商品模块
